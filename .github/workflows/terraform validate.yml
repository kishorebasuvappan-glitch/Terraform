on:
  push:
    branches:
      - terraform

jobs:
  terraform-test:
    name: Terraform Test & Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Find Terraform directory
        id: tf
        run: echo "dir=$(find . -name '*.tf' -type f -print -quit | xargs dirname)" >> $GITHUB_OUTPUT

      - name: Terraform Init
        working-directory: ${{ steps.tf.outputs.dir }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ steps.tf.outputs.dir }}
        run: terraform validate

